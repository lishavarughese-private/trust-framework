name: Spec-Kit CI Gates

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: speckit-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  speckit-gates:
    name: Spec-Kit Phase Gates
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure npm for GitHub Packages
        run: |
          echo "@lishavarughese-private:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: npm ci

      - name: Run all phase gates (SPEC -> PLAN -> TASKS -> IMPL)
        id: gates
        run: |
          mkdir -p ci-reports
          set +e
          node scripts/speckit.js gate SPEC --html 2>&1
          SPEC_CODE=$?
          echo "SPEC exit code: $SPEC_CODE"
          node scripts/speckit.js gate PLAN --html 2>&1
          PLAN_CODE=$?
          echo "PLAN exit code: $PLAN_CODE"
          node scripts/speckit.js gate TASKS --html 2>&1
          TASKS_CODE=$?
          echo "TASKS exit code: $TASKS_CODE"
          node scripts/speckit.js gate IMPL --html 2>&1
          IMPL_CODE=$?
          echo "IMPL exit code: $IMPL_CODE"
          if [ $SPEC_CODE -ne 0 ] || [ $PLAN_CODE -ne 0 ] || [ $TASKS_CODE -ne 0 ] || [ $IMPL_CODE -ne 0 ]; then
            echo "EXIT_CODE=1" >> "$GITHUB_OUTPUT"
          else
            echo "EXIT_CODE=0" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload CI reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speckit-ci-reports
          path: |
            ci-reports/
            ci-reports-tmp/
          retention-days: 90

      - name: Post gate report as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const reportsDir = "ci-reports-tmp";
            let body = "## Spec-Kit Gate Report\n\n";
            body += "### All Phase Results\n\n";
            body += "| Phase | Status | Passed | Total | Hard Fail | Soft Warn |\n";
            body += "|-------|--------|--------|-------|-----------|-----------|\n";
            const phases = ["SPEC", "PLAN", "TASKS", "IMPL"];
            let allPassed = true;
            for (const p of phases) {
              const jp = path.join(reportsDir, p + "-gate-report-latest.json");
              if (fs.existsSync(jp)) {
                const data = JSON.parse(fs.readFileSync(jp, "utf8"));
                const s = data.summary || {};
                const ok = data.transition_allowed;
                if (!ok) allPassed = false;
                const icon = ok ? "PASS" : "BLOCKED";
                body += "| **" + p + "** | " + icon + " | " +
                  (s.passed || 0) + " | " + (s.total_gates || 0) + " | " +
                  (s.hard_failures || 0) + " | " + (s.soft_warnings || 0) + " |\n";
                const gates = data.gates || [];
                const failed = gates.filter(g => g.result === "FAIL" && g.severity === "HARD");
                for (let fi = 0; fi < failed.length; fi++) {
                  const g = failed[fi];
                  body += "| | `" + (g.gate || "") + "` | " + (g.reason || "").substring(0, 120) + " | | |\n";
                }
              } else {
                body += "| **" + p + "** | NO REPORT | - | - | - | - |\n";
              }
            }
            body += "\n";
            body += "---\n";
            body += allPassed
              ? "### All phases passed - this PR is ready to merge.\n"
              : "### Merge BLOCKED - fix hard gate failures and push again.\n";
            body += "\nView full HTML report: https://github.com/" + context.repo.owner + "/" + context.repo.repo +
              "/actions/runs/" + context.runId + "\n\n";
            body += "Generated by Spec-Kit CI";
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number
            });
            const existing = comments.find(c => c.body.includes("Spec-Kit Gate Report"));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

      - name: Fail job if hard gate failed
        if: steps.gates.outputs.EXIT_CODE != '0'
        run: |
          echo "Spec-Kit CI hard gate FAILED. Merge is blocked."
          exit 1
