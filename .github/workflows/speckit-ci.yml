name: Spec-Kit CI Gates

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: speckit-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  speckit-gates:
    name: Spec-Kit Phase Gates
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure npm for GitHub Packages
        run: |
          echo "@lishavarughese-private:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: npm ci

      - name: Run gate evaluation
        id: gates
        run: |
          mkdir -p ci-reports
          node scripts/speckit.js gate --auto --html 2>&1 | tee ci-reports/gate-output.txt
          echo "EXIT_CODE=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Check gate exit code
        id: check
        run: |
          CODE=${{ steps.gates.outputs.EXIT_CODE }}
          if [ "$CODE" = "0" ]; then
            echo "HARD_RESULT=PASS" >> $GITHUB_OUTPUT
          else
            echo "HARD_RESULT=FAIL" >> $GITHUB_OUTPUT
          fi

      - name: Upload CI reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speckit-ci-reports
          path: ci-reports/
          retention-days: 90

      - name: Post gate report as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const reportsDir = 'ci-reports';
            let jsonContent = null;
            let phaseName = '';
            for (const phase of ['IMPL', 'TASKS', 'PLAN', 'SPEC']) {
              const j = path.join(reportsDir, phase + '-gate-report-latest.json');
              if (fs.existsSync(j)) {
                jsonContent = JSON.parse(fs.readFileSync(j, 'utf8'));
                phaseName = phase;
                break;
              }
            }

            if (!jsonContent) {
              console.log('No gate report found');
              return;
            }

            const hardResult = jsonContent.transition_allowed ? 'PASS' : 'FAIL';
            const hIcon  = hardResult === 'PASS' ? '\u2705' : '\u26D4';
            const s = jsonContent.summary || {};
            const gates = jsonContent.gates || [];

            let gateRows = gates.map(function(g) {
              const icon = g.result === 'PASS' ? '\u2705' : '\u26D4';
              return '| ' + icon + ' | ' + (g.gate || '') + ' | ' + (g.severity || '') + ' | ' + (g.reason || '') + ' |';
            }).join('\n');

            let blockText = '';
            const blocks = jsonContent.blocking_failures || [];
            if (blocks.length > 0) {
              blockText = '\n### \u26D4 Blocking Failures\n';
              blockText += blocks.map(function(b) {
                return '* **' + b.gate + '** \u2014 ' + (b.reason || '');
              }).join('\n');
            }

            const artifactUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + '/artifacts';

            const body = '## \u{1F3DB}\uFE0F Spec-Kit Gate Report\n\n' +
              '### ' + hIcon + ' ' + phaseName + ' Phase: ' + hardResult + '\n' +
              '> ' + (s.passed || 0) + '/' + (s.total_gates || 0) + ' gates passed | ' +
              (s.hard_failures || 0) + ' HARD failures | ' +
              (s.soft_warnings || 0) + ' SOFT warnings\n\n' +
              (hardResult === 'PASS'
                ? '\u2705 **All HARD gates passed.**'
                : '\u26D4 **HARD gate failure. Merge is BLOCKED.**') +
              '\n\n' +
              '| Status | Gate | Severity | Reason |\n' +
              '|--------|------|----------|--------|\n' +
              gateRows +
              blockText +
              '\n\n' +
              '\uD83D\uDCC4 [Download full HTML report](' + artifactUrl + ')' +
              '\n\n' +
              '*Generated by Spec-Kit CI*';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('Spec-Kit Gate Report'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail job if hard gate failed
        if: steps.check.outputs.HARD_RESULT == 'FAIL'
        run: |
          echo "\u26D4 Spec-Kit CI hard gate FAILED. Merge is blocked."
          exit 1
