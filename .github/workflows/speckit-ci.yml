name: Spec-Kit CI Gates

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

# Cancel in-flight runs for the same PR when a new commit is pushed
concurrency:
  group: speckit-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Run the full test suite and produce a test report
  # ─────────────────────────────────────────────────────────────
  run-tests:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with JSON reporter
        run: |
          mkdir -p ci-reports
          npx vitest run --reporter=json --outputFile=ci-reports/test-report.json || true
        # Note: `|| true` ensures the step doesn't fail here.
        # The speckit-trace script evaluates the results and sets the exit code.

      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: ci-reports/test-report.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Run Spec-Kit hard + soft gate checks
  # ─────────────────────────────────────────────────────────────
  speckit-gates:
    name: Spec-Kit CI Gates
    runs-on: ubuntu-latest
    needs: run-tests
    permissions:
      pull-requests: write
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download test report
        uses: actions/download-artifact@v4
        with:
          name: test-report
          path: ci-reports/

      - name: Restore baseline test report from cache
        uses: actions/cache@v4
        with:
          path: ci-reports/baseline-test-report.json
          key: speckit-baseline-${{ github.base_ref }}
          restore-keys: |
            speckit-baseline-

      - name: Run speckit-trace
        id: trace
        run: node scripts/speckit-trace.js
        continue-on-error: true
        # Exit code 1 from speckit-trace means hard gate failed.
        # We capture it and use it to post the PR comment before failing the job.

      - name: Read gate reports
        id: reports
        if: always()
        run: |
          echo "HARD_RESULT=$(node -e "const r=require('./ci-reports/hard-gate-report.json'); console.log(r.result)")" >> $GITHUB_OUTPUT
          echo "SOFT_RESULT=$(node -e "const r=require('./ci-reports/soft-gate-report.json'); console.log(r.result)")" >> $GITHUB_OUTPUT
          echo "NEEDS_LEAD=$(node -e "const r=require('./ci-reports/soft-gate-report.json'); console.log(r.needs_lead_review)")" >> $GITHUB_OUTPUT

      - name: Post hard gate report as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const hardReport = JSON.parse(fs.readFileSync('ci-reports/hard-gate-report.json', 'utf8'));
            const softReport = JSON.parse(fs.readFileSync('ci-reports/soft-gate-report.json', 'utf8'));

            const hardIcon  = hardReport.result === 'PASS' ? '✅' : '⛔';
            const softIcon  = softReport.result === 'PASS' ? '✅' : '⚠️';

            let hardLines = hardReport.checks.map(c => {
              const icon = c.passed ? '✅' : '❌';
              let line = `| ${icon} | \`${c.id}\` | ${c.label} |`;
              if (!c.passed && c.failures && c.failures.length > 0) {
                line += `\n>  ${c.failures.map(f => `↳ **${f.task_id || f.req_id || ''}** — ${f.message}`).join('\n> ')}`;
              }
              return line;
            }).join('\n');

            let softLines = softReport.checks.map(c => {
              const icon = c.passed ? '✅' : '⚠️';
              let line = `| ${icon} | \`${c.id}\` | ${c.label} |`;
              if (!c.passed && c.warnings && c.warnings.length > 0) {
                line += `\n> ${c.warnings.map(w => `↳ ${w.message}`).join('\n> ')}`;
              }
              return line;
            }).join('\n');

            const body = `## 🏛️ Spec-Kit CI Gate Report

            ### ${hardIcon} Hard Gate — \`${hardReport.result}\`
            > ${hardReport.passed}/${hardReport.total} checks passed

            | Status | Check | Description |
            |--------|-------|-------------|
            ${hardLines}

            ---

            ### ${softIcon} Soft Gate — \`${softReport.result}\`
            > ${softReport.passed}/${softReport.total} checks passed

            | Status | Check | Description |
            |--------|-------|-------------|
            ${softLines}

            ---

            ${hardReport.result === 'FAIL'
              ? '### ⛔ Merge is BLOCKED\nFix all hard gate violations and push a new commit.'
              : softReport.needs_lead_review
                ? '### ⚠️ Lead Review Required\nHard gates passed. A Team Lead must approve this PR before merge.'
                : '### ✅ All Gates Passed\nThis PR is ready to merge.'
            }

            *Generated by [speckit-trace.js](../blob/${{ github.sha }}/scripts/speckit-trace.js) at ${new Date().toISOString()}*`;

            // Find existing comment to update it
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('Spec-Kit CI Gate Report'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Apply needs-lead-review label if soft gate warnings present
        if: steps.reports.outputs.NEEDS_LEAD == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['needs-lead-review'],
            });

      - name: Remove needs-lead-review label if soft gate clean
        if: steps.reports.outputs.NEEDS_LEAD == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'needs-lead-review',
              });
            } catch (e) {
              // Label may not exist — that's fine
            }

      - name: Save updated baseline if hard gate passed
        if: steps.reports.outputs.HARD_RESULT == 'PASS'
        uses: actions/cache@v4
        with:
          path: ci-reports/baseline-test-report.json
          key: speckit-baseline-${{ github.base_ref }}

      - name: Upload all CI reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speckit-ci-reports
          path: ci-reports/
          retention-days: 90

      - name: Fail job if hard gate failed
        if: steps.reports.outputs.HARD_RESULT == 'FAIL'
        run: |
          echo "⛔ Spec-Kit CI hard gate FAILED. Merge is blocked."
          exit 1
